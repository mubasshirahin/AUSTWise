<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'" />
    <title>AUSTWise bubble</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15171c;
        --surface: #1c1f25;
        --border: #2b2f36;
        --text: #f2f3f5;
        --muted: #8c939e;
        --amber: #f2a900;
        --amber-soft: rgba(242, 169, 0, 0.16);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
        color: var(--text);
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      body.dragging {
        cursor: grabbing;
      }

      /* ── Collapsed: the chat head ─────────────────────────────────── */
      #bubble-view {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .bubble {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        transition: transform 0.16s ease, filter 0.16s ease;
      }

      .bubble:hover {
        transform: scale(1.06);
        filter: drop-shadow(0 0 10px rgba(242, 169, 0, 0.55));
      }

      .bubble:active {
        transform: scale(0.94);
      }

      .logo {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        -webkit-user-drag: none;
      }

      /* ── Expanded: the Quick Hub card ─────────────────────────────── */
      #card-view {
        display: none;
        width: 100%;
        height: 100%;
        padding: 0;
        box-sizing: border-box;
      }

      body.is-expanded #bubble-view {
        display: none;
      }

      body.is-expanded #card-view {
        display: block;
      }

      .card {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 18px;
        right: 18px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--amber), transparent);
        opacity: 0.85;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .head-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        cursor: move;
      }

      .tile {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: var(--amber-soft);
        color: var(--amber);
        display: grid;
        place-items: center;
        flex: none;
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }

      .sub {
        display: block;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }

      .close {
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: #b8bec7;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }

      .close:hover {
        color: #f43f5e;
        border-color: #f43f5e;
        background: rgba(244, 63, 94, 0.14);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 9px 4px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: #b8bec7;
        font-family: inherit;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .action:hover {
        color: var(--amber);
        border-color: rgba(242, 169, 0, 0.45);
        background: var(--amber-soft);
        transform: translateY(-1px);
      }

      .action.is-on {
        color: var(--amber);
        border-color: var(--amber);
        background: var(--amber-soft);
      }

      .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .jump {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s ease;
      }

      .jump:hover {
        border-color: rgba(242, 169, 0, 0.4);
        background: rgba(242, 169, 0, 0.1);
      }

      .jump svg:first-child {
        color: var(--amber);
        flex: none;
      }

      .jump .chev {
        color: #6b7280;
        margin-left: auto;
        flex: none;
      }

      .jump-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .foot {
        margin-top: auto;
        font-size: 10.5px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <!-- Collapsed: the chat head -->
    <div id="bubble-view">
      <div class="bubble" id="bubble" title="AUSTWise — click for Quick Hub, drag to move, right-click for menu">
        <!-- Same mark as the app's navbar logo: dark disc, white A/W, amber rule. -->
        <svg class="logo" viewBox="0 0 400 400" role="img" aria-label="AUSTWise">
          <circle cx="200" cy="200" r="188" fill="#111111" />
          <circle cx="200" cy="200" r="174" fill="none" stroke="#FFFFFF" stroke-width="3" />
          <g transform="translate(0,8)">
            <line x1="160" y1="236" x2="240" y2="236" stroke="#F2A900" stroke-width="18" />
            <polyline
              points="104,128 154,282 200,100 246,282 296,128"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="22"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
        </svg>
      </div>
    </div>

    <!-- Expanded: the Quick Hub card -->
    <div id="card-view">
      <div class="card" role="dialog" aria-label="AUSTWise Quick Hub">
        <div class="head">
          <div class="head-left" id="drag-handle" title="Drag to move">
            <span class="tile">
              <svg width="18" height="18" viewBox="0 0 400 400" aria-hidden="true">
                <circle cx="200" cy="200" r="188" fill="#111111" />
                <circle cx="200" cy="200" r="174" fill="none" stroke="#FFFFFF" stroke-width="10" />
                <g transform="translate(0,8)">
                  <line x1="160" y1="236" x2="240" y2="236" stroke="#F2A900" stroke-width="18" />
                  <polyline
                    points="104,128 154,282 200,100 246,282 296,128"
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-width="24"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </g>
              </svg>
            </span>
            <div>
              <h4 class="title">AUSTWise Quick Hub</h4>
              <span class="sub">Assistive tools &amp; shortcuts</span>
            </div>
          </div>
          <button class="close" id="close" type="button" aria-label="Close">×</button>
        </div>

        <div class="actions">
          <button class="action" type="button" data-act="app">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4h6v6" /><path d="M20 4l-8.5 8.5" /><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
            </svg>
            <span>Open App</span>
          </button>

          <button class="action is-on" type="button" data-act="pin" id="pin-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3h6l-1.2 5.2 3.2 3.3H7l3.2-3.3L9 3z" /><path d="M12 11.5V21" />
            </svg>
            <span>Pinned</span>
          </button>

          <button class="action" type="button" data-act="dock">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3" /><path d="M3 15h18" /><path d="M13 19h8" />
            </svg>
            <span>Dock</span>
          </button>

          <button class="action" type="button" data-act="quit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v9" /><path d="M6.5 6.5a8 8 0 1 0 11 0" />
            </svg>
            <span>Quit</span>
          </button>
        </div>

        <div class="section-label">Quick Jump</div>

        <div class="grid">
          <button class="jump" type="button" data-path="/dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span class="jump-name">Dashboard</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>

          <button class="jump" type="button" data-path="/takagelokoi">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" /><path d="M14.5 9.2H10a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H9.4" /><path d="M12 6.5v11" />
            </svg>
            <span class="jump-name">TakaGeloKoi</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>

          <button class="jump" type="button" data-path="/study-time">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4z" /><path d="M6 10.5V16c0 1.5 2.7 2.8 6 2.8s6-1.3 6-2.8v-5.5" />
            </svg>
            <span class="jump-name">Study Room</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>

          <button class="jump" type="button" data-path="/resource-vault">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" /><path d="M8 4v6h8V4" /><path d="M8 14h8" />
            </svg>
            <span class="jump-name">Vault</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>

          <button class="jump" type="button" data-path="/dashboard/routine">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2.5" /><path d="M8 3v4M16 3v4M3 10h18" />
            </svg>
            <span class="jump-name">Routine</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>

          <button class="jump" type="button" data-path="/workspace">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 18V7.5z" />
            </svg>
            <span class="jump-name">Workspace</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>

        <div class="foot">Drag the header to move · Esc to close</div>
      </div>
    </div>

    <script>
      const api = window.bubble;
      const body = document.body;
      const pinButton = document.getElementById('pin-btn');

      function setExpanded(flag) {
        body.classList.toggle('is-expanded', flag);
        if (flag) document.getElementById('close').focus({ preventScroll: true });
      }

      function setPinned(state) {
        pinButton.classList.toggle('is-on', state);
        pinButton.querySelector('span').textContent = state ? 'Pinned' : 'Pin';
        pinButton.setAttribute('aria-pressed', String(state));
      }

      if (api) {
        api.onExpanded(setExpanded);
        api.onPinState(setPinned);
      }

      /** Drag any element by its window position; a short press counts as a tap. */
      function attachDrag(el, onTap) {
        let pointerId = null;
        let startX = 0;
        let startY = 0;
        let moved = false;

        el.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          pointerId = event.pointerId;
          startX = event.screenX;
          startY = event.screenY;
          moved = false;
          el.setPointerCapture(pointerId);
          body.classList.add('dragging');
          if (api) api.dragStart();
        });

        el.addEventListener('pointermove', (event) => {
          if (pointerId === null || event.pointerId !== pointerId) return;
          const dx = event.screenX - startX;
          const dy = event.screenY - startY;
          if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) moved = true;
          if (moved && api) api.dragMove(dx, dy);
        });

        function endPointer(event) {
          if (pointerId === null || event.pointerId !== pointerId) return;
          pointerId = null;
          body.classList.remove('dragging');
          try {
            el.releasePointerCapture(event.pointerId);
          } catch {
            /* already released */
          }
          if (!moved && onTap) onTap();
          moved = false;
        }

        el.addEventListener('pointerup', endPointer);
        el.addEventListener('pointercancel', endPointer);
      }

      // Tap the chat head → open the Quick Hub card (no browser hop).
      attachDrag(document.getElementById('bubble'), () => {
        if (api) api.expand();
      });
      // Drag the card by its header.
      attachDrag(document.getElementById('drag-handle'));

      document.getElementById('close').addEventListener('click', () => api && api.collapse());

      document.querySelectorAll('[data-act]').forEach((button) => {
        button.addEventListener('click', () => {
          if (!api) return;
          const action = button.dataset.act;
          if (action === 'app') {
            api.openPath('/dashboard');
            api.collapse();
          } else if (action === 'pin') {
            api.togglePin();
          } else if (action === 'dock') {
            api.dock();
          } else if (action === 'quit') {
            api.quit();
          }
        });
      });

      document.querySelectorAll('.jump').forEach((button) => {
        button.addEventListener('click', () => {
          if (!api) return;
          api.openPath(button.dataset.path);
          api.collapse();
        });
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && api) api.collapse();
      });
    </script>
  </body>
</html>
