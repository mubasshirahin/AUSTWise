<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/austwise_icon_final.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AUSTWise &mdash; Your all-in-one campus companion for schedules, grades, resources, and community." />
    <meta name="google-site-verification" content="h4IqLozAjXb9woYcmEjlGAbwBLh7UZEUi3mgYmt1PnQ" />
    <title>AUSTWise &mdash; Your Campus Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Every family the app + all themes use, in ONE request. Previously the
         main stylesheet @import'ed these, so the browser could not even discover
         the font CSS until the ~230 kB stylesheet had downloaded and parsed —
         a serial round-trip on the critical path — and the theme files added
         four more separate font-CSS requests. -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;500;700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Noto+Sans+Bengali:wght@400;600;700&family=Orbitron:wght@400;500;700;800;900&family=Outfit:wght@400;500;700;800;900&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#171717" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aust-theme');
          var ok = ['light','dark','midnight','industrial','swiss','newsprint','sketchbook','minimalist-monochrome','terminal','art-deco','bitcoindefi','poster','nexus','cyberpunk','meshtopo'];
          if (t && ok.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.setAttribute('data-theme', 'dark');
        } catch(e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/austwise_icon_final.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
