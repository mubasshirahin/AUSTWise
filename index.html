<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/austwise_icon_final.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AUSTWise is the all-in-one campus companion for AUST students: class routine, CGPA calculator, question bank analyzer, campus map, budget tracker, chat, marketplace and more." />
    <meta name="google-site-verification" content="h4IqLozAjXb9woYcmEjlGAbwBLh7UZEUi3mgYmt1PnQ" />
    <title>AUSTWise &mdash; Campus Companion for AUST Students</title>
    <meta name="application-name" content="AUSTWise" />
    <meta name="robots" content="index, follow" />
    <!-- One canonical host (Vercel), so the Render mirror never competes in search. -->
    <link rel="canonical" href="https://austwise.vercel.app/" />
    <script>
      (function() {
        var c = document.querySelector('link[rel="canonical"]');
        if (c) c.href = 'https://austwise.vercel.app' + location.pathname;
      })();
    </script>

    <!-- Link previews (Facebook, Messenger, WhatsApp, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUSTWise" />
    <meta property="og:title" content="AUSTWise &mdash; Campus Companion for AUST Students" />
    <meta property="og:description" content="Routine, CGPA, question banks, campus map, budgeting, chat and marketplace for AUST students, all in one app." />
    <meta property="og:url" content="https://austwise.vercel.app/" />
    <meta property="og:image" content="https://austwise.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AUSTWise: Everything you need to ace your semester" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AUSTWise &mdash; Campus Companion for AUST Students" />
    <meta name="twitter:description" content="Routine, CGPA, question banks, campus map, budgeting, chat and marketplace for AUST students, all in one app." />
    <meta name="twitter:image" content="https://austwise.vercel.app/og-image.png" />

    <!-- Structured data: tells Google the site name and that this is a web app -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "AUSTWise",
          "alternateName": ["AUST Wise", "AUSTWise Campus Companion"],
          "url": "https://austwise.vercel.app/"
        },
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "AUSTWise",
          "url": "https://austwise.vercel.app/",
          "description": "All-in-one campus companion for students of Ahsanullah University of Science and Technology (AUST).",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Any",
          "image": "https://austwise.vercel.app/og-image.png",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BDT" },
          "author": { "@type": "Person", "name": "Mubasshir Ahin", "url": "https://github.com/mubasshirahin" }
        }
      ]
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Every family the app + all themes use, in ONE request. Previously the
         main stylesheet @import'ed these, so the browser could not even discover
         the font CSS until the ~230 kB stylesheet had downloaded and parsed —
         a serial round-trip on the critical path — and the theme files added
         four more separate font-CSS requests. -->
    <link rel="preload" as="style" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;500;700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Noto+Sans+Bengali:wght@400;600;700&family=Orbitron:wght@400;500;700;800;900&family=Outfit:wght@400;500;700;800;900&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <meta name="theme-color" content="#171717" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aust-theme');
          var ok = ['light','dark','midnight','industrial','swiss','newsprint','sketchbook','minimalist-monochrome','terminal','art-deco','bitcoindefi','poster','nexus','cyberpunk','meshtopo','blueprint','obsidian','pastel','prism','toon','lofi','sakura','arcade'];
          if (t && ok.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
          else document.documentElement.setAttribute('data-theme', 'blueprint');
          var l = localStorage.getItem('aust-layout');
          if (['classic','studio','bento','compact','aurora','zen','luxe','soft','motion','comic','desk','manga','hud'].indexOf(l) === -1) l = document.documentElement.getAttribute('data-theme') === 'blueprint' ? 'studio' : 'classic';
          document.documentElement.setAttribute('data-layout', l);
        } catch(e) {}
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
