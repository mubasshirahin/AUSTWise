# Render Blueprint — AUSTWise full-stack deploy
# Read: https://render.com/docs/blueprint-spec
#
# Deploys one web service running server/dev.mjs (SPA + /api + WebSocket).
# The server auto-runs `prisma push`-equivalent DDL (prismaTables.sql +
# db.mjs TABLE_DDL) on boot, so no migrate step is needed.
#
# DATABASE_URL is deliberately NOT provisioned here. The account data lives in
# Supabase — set DATABASE_URL in the Render dashboard to the Supabase pooler
# connection string. A Render-managed Postgres boots empty (only the seeded
# admin) and looks like total data loss. Set EXPECTED_MIN_USERS to guard:
# /healthz/db + /healthz/data return 503 and admin seeding is skipped when
# AuthUsers falls below that baseline.

services:
  - type: web
    name: austwise
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --ignore-scripts && npm run build && npx prisma generate --schema server/prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5174
      - key: DATABASE_URL
        sync: false
        # Set in the Render dashboard to the Supabase pooler connection string
        # (postgresql://postgres.<ref>:<pwd>@<region>.pooler.supabase.com:6543/postgres).
        # Keep PG_POOL_MAX low (default 5) for Supabase connection limits.
      - key: EXPECTED_MIN_USERS
        sync: false
        # Opt-in baseline, e.g. 2000. Below it /healthz/db + /healthz/data return
        # 503 and the default admin is not seeded — catches a wrong/empty DB.
      - key: SKIP_AWID_BACKFILL
        sync: false
        # Set to "1" for the first boot after repointing DATABASE_URL to avoid
        # a full-table AWID rewrite. Unset once a sample of rows is verified.
      - key: PUBLIC_BASE_URL
        sync: false
        # Set after first deploy: https://austwise.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://austwise.vercel.app
        # Frontend origin if split-host (Vercel/Netlify). Empty = same-origin.
        # Restrict CORS/cookies to the live Vercel front-end only.
      - key: COOKIE_SECURE
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: CRYPTO_SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
        # >= 12 chars, else admin is NOT seeded.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
        # Required for Telegram webhook in production.
      - key: VAPID_PUBLIC_KEY
        sync: false
        # Web Push: npx web-push generate-vapid-keys (public half).
      - key: VAPID_PRIVATE_KEY
        sync: false
        # Web Push: keep secret — never expose to the browser.
      - key: VAPID_SUBJECT
        value: mailto:austwise@aust.edu
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ROUTINE_MODEL
        value: gpt-4.1
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_GOOGLE_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_WS_URL
        sync: false
        # If frontend is on a different host, e.g. wss://<backend>.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: SSL_STORE_ID
        sync: false
      - key: SSL_STORE_PASSWORD
        sync: false
      - key: SSL_IS_LIVE
        sync: false
      - key: PIPRAPAY_API_KEY
        sync: false
      - key: PIPRAPAY_BASE_URL
        sync: false