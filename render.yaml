# Render Blueprint — AUSTWise full-stack deploy
# Read: https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. A free Postgres instance (render-postgres)  →  injects DATABASE_URL
#   2. A web service running server/dev.mjs         →  serves SPA + /api + WebSocket
#
# The server auto-runs `prisma push`-equivalent DDL (prismaTables.sql +
# db.mjs TABLE_DDL) on boot, so no migrate step is needed.

databases:
  - name: austwise-db
    plan: free
    region: singapore

services:
  - type: web
    name: austwise
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --ignore-scripts && npm run build && npx prisma generate --schema server/prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5174
      - key: DATABASE_URL
        fromDatabase:
          name: austwise-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
        # Set after first deploy: https://austwise.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://austwise.vercel.app
        # Frontend origin if split-host (Vercel/Netlify). Empty = same-origin.
        # Restrict CORS/cookies to the live Vercel front-end only.
      - key: COOKIE_SECURE
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: CRYPTO_SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
        # >= 12 chars, else admin is NOT seeded.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
        # Required for Telegram webhook in production.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ROUTINE_MODEL
        value: gpt-4.1
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_GOOGLE_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_WS_URL
        sync: false
        # If frontend is on a different host, e.g. wss://<backend>.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: SSL_STORE_ID
        sync: false
      - key: SSL_STORE_PASSWORD
        sync: false
      - key: SSL_IS_LIVE
        sync: false
      - key: PIPRAPAY_API_KEY
        sync: false
      - key: PIPRAPAY_BASE_URL
        sync: false